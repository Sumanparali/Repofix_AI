databases:
  - name: repofix-db
    plan: free
    region: singapore
    databaseName: repofix
    user: repofix

services:
  - type: web
    name: repofix-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: repofix-db
          property: connectionString
      - key: HOST
        value: 0.0.0.0
      - key: REPOFIX_QUEUE_MODE
        value: local
      - key: REPOFIX_ANALYSIS_ONLY
        value: "1"
      - key: REPOFIX_AUTH_MODE
        value: firebase
      - key: REPOFIX_WORKSPACE
        value: /tmp/repofix-work
      - key: REPOFIX_ALLOW_LOCAL_WEB
        value: "0"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
